<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード入力 - UnReal</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(0,0,0,0.3);
        }
        .passcode-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .lock-icon {
            font-size: 64px;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .passcode-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .passcode-input:focus {
            outline: none;
            border-color: #ffed4e;
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        .submit-btn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通ヘッダー。配色はページの文字色と背景に馴染ませる */
        body {
            padding-top: 68px;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(128, 128, 128, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.35);
        }

        /* ページ番号はヘッダーより前面に置く */
        .page-number {
            z-index: 300;
        }

        .site-search {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 170px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-search">
            <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
            <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
        </div>
    </header>
    <div class="page-number">42/55</div>
    
    <div class="passcode-container">
        <div class="lock-icon">🔐</div>
        <h1>パスワードを入力</h1>
        <input type="text" class="passcode-input" id="passcode" placeholder="パスワード">
        <button class="submit-btn" onclick="checkPasscode()">確認</button>
    </div>
    
    <script>
        function checkPasscode() {
            const input = document.getElementById('passcode').value;
            
            // パスワード: 20060719 (みれいのドラフト記事の日付)
            if (input === '20060719') {
                // 正解: りんちゃんのこと（ドラフト）へ
                window.location.href = '../blog_ex/mirei/draft.html';
            } else {
                alert('パスワードが違います');
                document.getElementById('passcode').value = '';
            }
        }
        
        document.getElementById('passcode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPasscode();
            }
        });
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
