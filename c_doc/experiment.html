<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脳機能解放実験 - UnReal</title>
    <style>
        body { background: #000033; color: #00ffff; font-family: monospace; padding: 40px 20px; }
        .page-number { position: fixed; top: 20px; right: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .warning { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通ヘッダー。配色はページの文字色と背景に馴染ませる */
        body {
            padding-top: 68px;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(128, 128, 128, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.35);
        }

        /* ページ番号はヘッダーより前面に置く */
        .page-number {
            z-index: 300;
        }

        .site-search {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 170px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-search">
            <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
            <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
        </div>
    </header>
    <div class="page-number">41/55</div>
    <div class="container">
        <h1 class="warning">【極秘】脳機能解放実験</h1>
        <p>被験者: 藤野凪紗</p>
        <p>実験コード: MYSTIC</p>
        <p>結果: 成功</p>
    </div>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
