<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週刊ライク - リーク記事</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            line-height: 1.6;
        }
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            opacity: 0.7;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #0f0;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .classified {
            color: #f00;
            font-weight: bold;
        }
        .redacted {
            background: #0f0;
            color: #0f0;
        }
        .content {
            background: rgba(0,255,0,0.05);
            padding: 20px;
            border: 1px solid #0f0;
            margin-bottom: 20px;
        }
        /* リーク記事の誌面スキャン */
        .scan-image {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #0f0;
            margin-bottom: 30px;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通の検索窓（配色はページの文字色を継承する） */
        .site-search {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            background: rgba(128, 128, 128, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 150px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-number">15/55</div>
    <div class="container">
        <h1>【機密】週刊ライク - リーク記事</h1>
        <img src="../images/docs/like_magazine.jpg" alt="週刊ライク 2025年5月16日発売号「別会社のはずが裏で一本化!?」の誌面" class="scan-image">
        <div class="content">
            <p class="classified">【極秘情報】</p>
            <p>Easter Productionとエッグスアカデミーの関係について</p>
            <p>両社は表向きは別会社だが、実は<span class="redacted">████████</span>によって繋がっている。</p>
            <p>エッグスアカデミーは<strong>実験体の選定機関</strong>として機能しており...</p>
            <br>
            <p>キーワード: <strong>エッグスアカデミー</strong></p>
        </div>
    </div>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <div class="site-search">
        <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
        <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
    </div>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
