<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True End - UnReal</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .ending-content {
            max-width: 700px;
            padding: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .message {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .members {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 36px;
            margin: 30px 0;
        }
        .secret-member {
            animation: fadeIn 2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="ending-content">
        <h1>TRUE ENDING - 8 Members</h1>
        <div class="members">
            ❤️🩷🧡💛💚💙💜<span class="secret-member">🤍</span>
        </div>
        <div class="message">
            <p>全ての真実が明らかになった。</p>
            <p>隠されていた8人目のメンバー...</p>
            <p>りんの双子の姉妹、そして新たな仲間。</p>
            <br>
            <p>事務所は解体され、犯人は逮捕された。</p>
            <p>8人で新しい事務所を立ち上げ、</p>
            <p>本当の「UnRe:al」が始まる。</p>
            <br>
            <p style="font-size: 24px;">🎊 Congratulations! 🎊</p>
        </div>
    </div>
</body>
</html>
