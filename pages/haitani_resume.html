<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰谷の履歴書 - UnReal</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 40px;
            min-height: 100vh;
        }
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #666;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .content {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
        }
        a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通の検索窓（配色はページの文字色を継承する） */
        .site-search {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            background: rgba(128, 128, 128, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 150px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-number">10/55</div>
    <div class="container">
        <h1>灰谷の履歴書</h1>
        <div class="content">
            <p>マネージャー灰谷の履歴書</p>
            
            <div style="background: rgba(102, 126, 234, 0.1); padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 3px solid #667eea;">
                <p style="margin: 0; font-size: 14px; color: #999;">配置されたワード：</p>
                <p style="margin: 5px 0; font-size: 18px; color: #667eea; font-weight: bold;">シムネルカンパニー</p>
            </div>
            
            <p style="margin-top: 30px;">
                <a href="../index.html">← TOPに戻る</a>
            </p>
        </div>
    </div>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <div class="site-search">
        <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
        <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
    </div>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
