<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式サイトリニューアルのお知らせ - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .article-date {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 32px;
            line-height: 1.4;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .article-body p {
            color: #ddd;
            line-height: 2;
            margin-bottom: 24px;
        }

        .article-sign {
            margin-top: 48px;
            text-align: right;
            color: #999;
        }

        .link-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 60px;
        }

        .back-link {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #fff;
            color: #000;
        }
    </style>
    <link rel="icon" href="../../images/logo/unreal.png">
    <style>
        /* 全ページ共通の検索窓（配色はページの文字色を継承する） */
        .site-search {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            background: rgba(128, 128, 128, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 150px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-number" style="position:fixed;top:20px;right:20px;font-size:12px;opacity:0.5;z-index:200;pointer-events:none;">-/55</div>
    <div class="container">
        <div class="article-date">2026.08.17</div>
        <h1 class="article-title">公式サイトリニューアルのお知らせ</h1>

        <div class="article-body">
            <p>いつもUnRe:alを応援いただき、誠にありがとうございます。</p>

            <p>このたび、UnRe:al公式サイトをリニューアルいたしました。</p>

            <p>各メンバーのプロフィールやブログをより見やすく再構成し、最新情報をお届けしやすい構成に変更しております。</p>

            <p>今後ともUnRe:alをよろしくお願いいたします。</p>

            <p class="article-sign">Easter Production</p>
        </div>

        <div class="link-group">
            <a href="../news.html" class="back-link">NEWS一覧へ</a>
            <a href="../../index.html" class="back-link">TOPに戻る</a>
        </div>
    </div>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <div class="site-search">
        <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
        <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
    </div>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
