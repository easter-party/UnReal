<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調査ログ No.46 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 0, 0.03) 3px
            );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .page-number {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 14px;
            opacity: 0.7;
        }

        .log-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 40px;
        }

        .log-title {
            font-size: 32px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 0 0 10px #00ff00;
            }
            25% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
            }
            50% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
            }
        }

        .log-subtitle {
            font-size: 16px;
            color: #00cc00;
            opacity: 0.8;
        }

        .log-content {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .log-text {
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .important-text {
            color: #ffff00;
            font-weight: bold;
            text-decoration: underline;
        }

        .terminal-section {
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
        }

        .terminal-prompt {
            color: #00ff00;
            margin-bottom: 10px;
        }

        .keyword-input {
            width: 100%;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .keyword-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .submit-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .error-message {
            color: #ff0000;
            margin-top: 10px;
            display: none;
            animation: blink 0.5s ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }


        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .log-title {
                font-size: 24px;
            }
            
            .log-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-number">46/50</div>
        
        <div class="log-header">
            <h1 class="log-title">調査ログ No.46</h1>
            <p class="log-subtitle">最終確認フェーズ</p>
        </div>

        <div class="log-content">
            <div class="log-text">
                <p>あなたはついに真実に辿り着いた。</p>
                <br>
                <p>暁月りんの失踪、そして<span class="important-text">イースターの闇</span>。</p>
                <p>すべての証拠は揃った。</p>
                <br>
                <p>事務所が隠し続けてきた秘密、それは...</p>
                <p>メンバー全員が<span class="important-text">実験体</span>として利用されていたという事実。</p>
                <br>
                <p>りんは真実を知り、それを世に公表しようとした。</p>
                <p>しかし、事務所はそれを許さなかった。</p>
                <br>
                <p>今、あなたの選択が物語の結末を決める。</p>
            </div>

            <div class="terminal-section">
                <div class="terminal-prompt">&gt; システムメッセージ</div>
                <p style="color: #00ff00; margin-bottom: 20px;">
                    最終確認を行います。<br>
                    真実を公表するためのキーワードを入力してください。
                </p>
                
                <input type="text" class="keyword-input" id="keywordInput" placeholder="キーワードを入力...">
                <button class="submit-btn" onclick="checkKeyword()">送信</button>
                
                <div class="error-message" id="errorMessage">
                    不正解です。バッドエンドへ...
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← TOPに戻る</a>
    </div>

    <script>
        // ページ訪問記録
        const visitedPages = JSON.parse(localStorage.getItem('visitedPages') || '[]');
        if (!visitedPages.includes('46')) {
            visitedPages.push('46');
            localStorage.setItem('visitedPages', JSON.stringify(visitedPages));
        }
        localStorage.setItem('currentLogPage', '46');

        function checkKeyword() {
            const input = document.getElementById('keywordInput').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            
            // 正解キーワードのチェック
            if (input === '正解キーワード1') {
                // 7人エンディング（準真エンド）
                localStorage.setItem('endingType', 'seven');
                localStorage.setItem('endingReached', 'true');
                window.location.href = 'ending_seven.html';
            } else if (input === '正解キーワード2') {
                // 8人真エンディング（No.49経由）
                localStorage.setItem('endingType', 'eight');
                localStorage.setItem('shouldGoTo49', 'true');
                window.location.href = 'log_49.html';
            } else {
                // バッドエンド
                errorMsg.style.display = 'block';
                setTimeout(() => {
                    localStorage.setItem('endingType', 'bad');
                    localStorage.setItem('endingReached', 'true');
                    window.location.href = 'ending_bad.html';
                }, 2000);
            }
        }

        // Enterキーでも送信可能
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkKeyword();
            }
        });

        // タイピングエフェクト
        const input = document.getElementById('keywordInput');
        input.addEventListener('input', function() {
            this.style.textShadow = '0 0 5px #00ff00';
            setTimeout(() => {
                this.style.textShadow = 'none';
            }, 100);
        });
    </script>
</body>
</html>
