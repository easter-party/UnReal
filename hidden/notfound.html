<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* グリッチエフェクト用の背景 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 255, 0.03) 2px,
                rgba(255, 0, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(20px); }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff0066;
            text-shadow: 
                0 0 10px rgba(255, 0, 102, 0.8),
                0 0 20px rgba(255, 0, 102, 0.6),
                0 0 30px rgba(255, 0, 102, 0.4);
            animation: glitch 2s infinite;
            position: relative;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 
                    0 0 10px rgba(255, 0, 102, 0.8),
                    0 0 20px rgba(255, 0, 102, 0.6),
                    0 0 30px rgba(255, 0, 102, 0.4);
            }
            20% {
                text-shadow: 
                    2px 2px 10px rgba(0, 255, 255, 0.8),
                    -2px -2px 10px rgba(255, 0, 255, 0.8),
                    0 0 20px rgba(255, 0, 102, 0.6);
            }
            40% {
                text-shadow: 
                    -2px 0 10px rgba(255, 255, 0, 0.8),
                    2px 0 10px rgba(0, 255, 0, 0.8),
                    0 0 20px rgba(255, 0, 102, 0.6);
            }
        }

        .error-title {
            font-size: 24px;
            margin: 20px 0;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .error-message {
            font-size: 16px;
            margin: 30px 0;
            color: #888;
            line-height: 1.6;
        }

        .glitch-text {
            display: inline-block;
            position: relative;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            animation: glitch-1 0.5s infinite;
            color: #00ff00;
            z-index: -1;
        }

        .glitch-text::after {
            animation: glitch-2 0.5s infinite;
            color: #ff00ff;
            z-index: -2;
        }

        @keyframes glitch-1 {
            0% {
                clip: rect(44px, 450px, 56px, 0);
                transform: translate(-2px, -2px);
            }
            20% {
                clip: rect(20px, 450px, 30px, 0);
                transform: translate(2px, 2px);
            }
            40% {
                clip: rect(60px, 450px, 80px, 0);
                transform: translate(-1px, 1px);
            }
            60% {
                clip: rect(10px, 450px, 90px, 0);
                transform: translate(1px, -1px);
            }
            80% {
                clip: rect(30px, 450px, 40px, 0);
                transform: translate(0px, -2px);
            }
            100% {
                clip: rect(70px, 450px, 85px, 0);
                transform: translate(-2px, 0);
            }
        }

        @keyframes glitch-2 {
            0% {
                clip: rect(65px, 450px, 75px, 0);
                transform: translate(2px, 2px);
            }
            20% {
                clip: rect(15px, 450px, 25px, 0);
                transform: translate(-2px, -2px);
            }
            40% {
                clip: rect(35px, 450px, 45px, 0);
                transform: translate(1px, -1px);
            }
            60% {
                clip: rect(50px, 450px, 60px, 0);
                transform: translate(-1px, 1px);
            }
            80% {
                clip: rect(70px, 450px, 80px, 0);
                transform: translate(2px, 0);
            }
            100% {
                clip: rect(20px, 450px, 30px, 0);
                transform: translate(0, 2px);
            }
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 2px solid #ff0066;
            color: #ff0066;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .back-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #ff0066;
            transition: left 0.3s ease;
            z-index: -1;
        }

        .back-link:hover {
            color: #000;
        }

        .back-link:hover::before {
            left: 0;
        }

        .hint {
            margin-top: 50px;
            font-size: 12px;
            color: #444;
            font-style: italic;
        }

        /* モバイル対応 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 20px;
            }

            .error-message {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">
            <span class="glitch-text" data-text="Page Not Found">Page Not Found</span>
        </h1>
        <p class="error-message">
            お探しのページは見つかりませんでした。<br>
            URLが正しいか確認してください。
        </p>
        <p class="error-message">
            The page you are looking for does not exist.<br>
            It might have been removed or the URL might be incorrect.
        </p>
        <a href="../index.html" class="back-link">Back to Home</a>
        
        <p class="hint">
            // もしかして、別のキーワードで検索してみては？
        </p>
    </div>
</body>
</html>
