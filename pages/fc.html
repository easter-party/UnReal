<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC LOGIN - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #722F37;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 50px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .fc-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .hint-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .hint-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .hint-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .back-link {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        .fc-content {
            display: none;
            text-align: center;
            color: #333;
        }
        
        .fc-name {
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        
        .fc-name-sub {
            display: block;
            font-size: 30px;
            color: #667eea;
        }
        
        .fc-lead {
            font-size: 15px;
            font-weight: bold;
        }
        
        .fc-sub {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }
        
        /* メンバーごとの丸ボタン。幅が足りなければ折り返す */
        .blog-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            margin-top: 24px;
        }
        
        .blog-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .blog-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* TOPと同じナビゲーションの高さ分を確保する */
        body {
            padding-top: 84px;
        }

        .page-number {
            z-index: 300;
        }
    </style>
    <link rel="stylesheet" href="../assets/page-history.css">
    <script src="../assets/page-history.js" data-root="../"></script>
    <link rel="stylesheet" href="../assets/site-nav.css">
    <script src="../assets/site-nav.js" data-root="../"></script>
</head>
<body>
    <div class="page-number">8/55</div>
    
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">UnRe:al FC</h1>
            <p class="login-subtitle">ファンクラブ会員ログイン</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">ユーザーID</label>
                <input type="text" class="form-input" id="userId" placeholder="フルネーム英字">
            </div>
            
            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" class="form-input" id="password" placeholder="英字8桁">
            </div>
            
            <button type="submit" class="login-btn">ログイン</button>
        </form>
        
        <div class="status-message" id="statusMessage"></div>
        
        
        <div class="fc-content" id="fcContent">
            <h2 class="fc-name">UnRe:al official FC<span class="fc-name-sub">Re:alists</span></h2>
            <p class="fc-lead">FC会員限定コンテンツ</p>
            <p class="fc-sub">会員限定ブログラインナップ</p>
            <div class="blog-links">
                <a href="../blog_ex/rin.html" class="blog-link">りん</a>
                <a href="../blog_ex/yuno.html" class="blog-link">ゆの</a>
                <a href="../blog_ex/aki.html" class="blog-link">あき</a>
                <a href="../blog_ex/mirei.html" class="blog-link">みれい</a>
                <a href="../blog_ex/iroha.html" class="blog-link">いろは</a>
                <a href="../blog_ex/ran.html" class="blog-link">らん</a>
                <a href="../blog_ex/nagisa.html" class="blog-link">なぎさ</a>
            </div>
        </div>
    </div>
    
    <a href="../index.html" class="back-link">← TOPに戻る</a>
    
    <script>
        // ログインフォーム処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            
            // ログイン情報（IDは姓名・名姓どちらの並びでも通す）
            const validLogins = [
                { id: 'kinjomirei', pass: 'Stargaze' },
                { id: 'mireikinjo', pass: 'Stargaze' }
            ];
            
            // 大文字小文字は区別しない
            const isValid = validLogins.some(login =>
                login.id.toLowerCase() === userId.toLowerCase()
                && login.pass.toLowerCase() === password.toLowerCase()
            );
            
            if (isValid) {
                // ログイン成功
                localStorage.setItem('fcLoggedIn', 'true');
                localStorage.setItem('fcUserId', userId);
                
                statusMsg.className = 'status-message success';
                statusMsg.textContent = 'ログインに成功しました！';
                statusMsg.style.display = 'block';
                
                // FCコンテンツを表示（ページ遷移なし）
                showFCContent();
            } else {
                // ログイン失敗
                statusMsg.className = 'status-message error';
                statusMsg.textContent = 'IDまたはパスワードが違います';
                statusMsg.style.display = 'block';
                
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 3000);
            }
        });
        
        // FCコンテンツ表示
        function showFCContent() {
            document.querySelector('.login-header').style.display = 'none';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('fcContent').style.display = 'block';
        }
        
        // ログイン状態確認
        window.addEventListener('load', function() {
            if (localStorage.getItem('fcLoggedIn') === 'true') {
                showFCContent();
            }
        });
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
</body>
</html>
