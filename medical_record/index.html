<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
            color: #222;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .result-summary {
            color: #666;
            font-size: 13px;
            padding-bottom: 16px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 8px;
        }

        .result-summary strong {
            color: #222;
        }

        /* 検索結果の各項目 */
        .result-item {
            display: block;
            padding: 22px 4px;
            border-bottom: 1px solid #e5e5e5;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: #fff;
        }

        .result-url {
            color: #3a7d3a;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .result-title {
            color: #1a4fb4;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .result-item:hover .result-title {
            text-decoration: underline;
        }

        .result-snippet {
            color: #555;
            font-size: 13px;
            line-height: 1.8;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #222;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通ヘッダー。配色はページの文字色と背景に馴染ませる */
        body {
            padding-top: 68px;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(128, 128, 128, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.35);
        }

        /* ページ番号はヘッダーより前面に置く */
        .page-number {
            z-index: 300;
        }

        .site-search {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 170px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-search">
            <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
            <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
        </div>
    </header>
    <div class="page-number" style="position:fixed;top:20px;right:20px;font-size:12px;opacity:0.5;z-index:200;pointer-events:none;">-/55</div>
    <div class="container">
        <p class="result-summary"><strong>「シムネルカンパニー」</strong>に関連する文書が 2 件見つかりました</p>

        <a href="yuno.html" class="result-item">
            <div class="result-url">medical_record/yuno.html</div>
            <h2 class="result-title">被験体管理記録 ／ 百瀬ゆの</h2>
            <p class="result-snippet">
                管理番号・適応区分・能力値推移を含む被験体管理記録。保護管轄および既往歴の記載あり。
            </p>
        </a>

        <a href="ran.html" class="result-item">
            <div class="result-url">medical_record/ran.html</div>
            <h2 class="result-title">被験体管理記録 ／ 星名らん</h2>
            <p class="result-snippet">
                管理番号・適応区分・能力値推移を含む被験体管理記録。備考欄に別途資料への参照あり。
            </p>
        </a>

        <a href="../index.html" class="back-link">← TOPに戻る</a>
    </div>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
