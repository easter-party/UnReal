<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC LOGIN - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 50px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .fc-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .hint-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .hint-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .hint-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .back-link {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        .contact-btn {
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .contact-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .contact-link:hover {
            text-decoration: underline;
        }
        
        .fc-content {
            display: none;
            margin-top: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
        }
        
        .fc-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .blog-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .blog-link {
            display: block;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .blog-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通の検索窓（配色はページの文字色を継承する） */
        .site-search {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            background: rgba(128, 128, 128, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 150px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-number">8/55</div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="fc-logo">🌟</div>
            <h1 class="login-title">UnRe:al FC</h1>
            <p class="login-subtitle">ファンクラブ会員ログイン</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">ユーザーID</label>
                <input type="text" class="form-input" id="userId" placeholder="フルネーム英字">
            </div>
            
            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" class="form-input" id="password" placeholder="英字8桁">
            </div>
            
            <button type="submit" class="login-btn">ログイン</button>
        </form>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="contact-btn" id="contactBtn">
            <a href="#" class="contact-link" onclick="goToContact()">→ CONTACT</a>
        </div>
        
        <div class="fc-content" id="fcContent">
            <h2>🌟 FC会員限定コンテンツ</h2>
            <p>ログインありがとうございます！</p>
            <p>以下のメンバーの限定ブログをご覧いただけます：</p>
            <div class="blog-links">
                <a href="../blog_ex/rin.html" class="blog-link">りんの秘密</a>
                <a href="../blog_ex/yuno.html" class="blog-link">ゆのの秘密</a>
                <a href="../blog_ex/aki.html" class="blog-link">あきの秘密</a>
                <a href="../blog_ex/mirei.html" class="blog-link">みれいの秘密</a>
                <a href="../blog_ex/iroha.html" class="blog-link">いろはの秘密</a>
                <a href="../blog_ex/ran.html" class="blog-link">らんの秘密</a>
                <a href="../blog_ex/nagisa.html" class="blog-link">なぎさの秘密</a>
            </div>
        </div>
    </div>
    
    <a href="../index.html" class="back-link">← TOPに戻る</a>
    
    <script>
        // ログインフォーム処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            
            // ログイン情報（IDは姓名・名姓どちらの並びでも通す）
            const validLogins = [
                { id: 'kinjomirei', pass: 'Stargaze' },
                { id: 'mireikinjo', pass: 'Stargaze' }
            ];
            
            // 大文字小文字は区別しない
            const isValid = validLogins.some(login =>
                login.id.toLowerCase() === userId.toLowerCase()
                && login.pass.toLowerCase() === password.toLowerCase()
            );
            
            if (isValid) {
                // ログイン成功
                localStorage.setItem('fcLoggedIn', 'true');
                localStorage.setItem('fcUserId', userId);
                
                statusMsg.className = 'status-message success';
                statusMsg.textContent = 'ログインに成功しました！';
                statusMsg.style.display = 'block';
                
                // CONTACTボタン表示
                document.getElementById('contactBtn').style.display = 'block';
                
                // FCコンテンツを表示（ページ遷移なし）
                showFCContent();
            } else {
                // ログイン失敗
                statusMsg.className = 'status-message error';
                statusMsg.textContent = 'IDまたはパスワードが違います';
                statusMsg.style.display = 'block';
                
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 3000);
            }
        });
        
        // FCコンテンツ表示
        function showFCContent() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('fcContent').style.display = 'block';
        }
        
        // CONTACTページへ（ゴール）
        function goToContact() {
            // CONTACTページへ遷移（クリア画面）
            window.location.href = 'contact.html';
        }
        
        // ログイン状態確認
        window.addEventListener('load', function() {
            if (localStorage.getItem('fcLoggedIn') === 'true') {
                document.getElementById('contactBtn').style.display = 'block';
                showFCContent();
            }
        });
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <div class="site-search">
        <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
        <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
    </div>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
