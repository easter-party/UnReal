<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード入力 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #8B0000;
            background: linear-gradient(135deg, #8B0000 0%, #4B0000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        
        .password-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .lock-icon {
            font-size: 72px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        .password-title {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .password-subtitle {
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .password-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        
        .password-input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover {
            background: #fff;
            color: #8B0000;
            transform: translateY(-2px);
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 20px;
            display: none;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #fff;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通の検索窓（配色はページの文字色を継承する） */
        .site-search {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            background: rgba(128, 128, 128, 0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 150px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="page-number">47/55</div>
    
    <div class="password-container">
        <div class="lock-icon">🔐</div>
        <h1 class="password-title">Access Restricted</h1>
        <p class="password-subtitle">パスワードを入力してください</p>
        
        <input type="password" class="password-input" id="passwordInput" placeholder="••••••••">
        <button class="submit-btn" onclick="checkPassword()">ENTER</button>
        
        <div class="error-message" id="errorMsg">
            パスワードが違います
        </div>
    </div>
    
    <a href="../index.html" class="back-link">← 戻る</a>
    
    <script>
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            // パスワードチェック（U81220401）
            if (input === 'U81220401' || input === 'u81220401') {
                // 成功 - 46番ページへ
                localStorage.setItem('passwordCleared29', 'true');
                window.location.href = '../hidden/found_me.html';
            } else {
                // エラー表示
                errorMsg.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }
        
        // Enterキーでも送信
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <div class="site-search">
        <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
        <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
    </div>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
