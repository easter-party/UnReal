<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC LOGIN - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-number {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        
        .login-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 50px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .fc-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .hint-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .hint-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .hint-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .back-link {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        .contact-btn {
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .contact-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-number">8/50</div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="fc-logo">🌟</div>
            <h1 class="login-title">UnRe:al FC</h1>
            <p class="login-subtitle">ファンクラブ会員ログイン</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">ユーザーID</label>
                <input type="text" class="form-input" id="userId" placeholder="IDを入力">
            </div>
            
            <div class="form-group">
                <label class="form-label">パスワード</label>
                <input type="password" class="form-input" id="password" placeholder="パスワードを入力">
            </div>
            
            <button type="submit" class="login-btn">ログイン</button>
        </form>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="contact-btn" id="contactBtn">
            <a href="#" class="contact-link" onclick="goToContact()">→ CONTACT</a>
        </div>
    </div>
    
    <a href="../index.html" class="back-link">← TOPに戻る</a>
    
    <script>
        // ログインフォーム処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMessage');
            
            // 仮のログイン情報（2パターン）
            const validLogins = [
                { id: 'user1', pass: 'pass1' },
                { id: 'user2', pass: 'pass2' },
                // 実際のメンバー関連（例）
                { id: 'fortune_ngs', pass: 'fortune' },
                { id: 'nagisa', pass: 'Mystic' }
            ];
            
            const isValid = validLogins.some(login => 
                login.id === userId && login.pass === password
            );
            
            if (isValid) {
                // ログイン成功
                localStorage.setItem('fcLoggedIn', 'true');
                localStorage.setItem('fcUserId', userId);
                
                statusMsg.className = 'status-message success';
                statusMsg.textContent = 'ログインに成功しました！';
                statusMsg.style.display = 'block';
                
                // CONTACTボタン表示
                document.getElementById('contactBtn').style.display = 'block';
                
                setTimeout(() => {
                    // ブログページにリダイレクト
                    window.location.href = 'blog.html';
                }, 2000);
            } else {
                // ログイン失敗
                statusMsg.className = 'status-message error';
                statusMsg.textContent = 'IDまたはパスワードが違います';
                statusMsg.style.display = 'block';
                
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 3000);
            }
        });
        
        // CONTACTページへ（ゴール）
        function goToContact() {
            // CONTACTページへ遷移（クリア画面）
            window.location.href = 'contact.html';
        }
        
        // ログイン状態確認
        window.addEventListener('load', function() {
            if (localStorage.getItem('fcLoggedIn') === 'true') {
                document.getElementById('contactBtn').style.display = 'block';
            }
        });
    </script>
</body>
</html>
