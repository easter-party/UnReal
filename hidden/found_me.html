<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調査ログ No.46 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 0, 0.03) 3px
            );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .page-number {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 14px;
            opacity: 0.7;
        }

        .log-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 40px;
        }

        .log-title {
            font-size: 32px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 0 0 10px #00ff00;
            }
            25% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
            }
            50% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
            }
        }

        .log-subtitle {
            font-size: 16px;
            color: #00cc00;
            opacity: 0.8;
        }

        .log-content {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .log-text {
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .terminal-input {
            background: rgba(0, 20, 0, 0.9);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            margin-top: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .terminal-label {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 14px;
            display: block;
        }

        .keyword-input {
            width: 100%;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 3px;
            margin-bottom: 15px;
        }

        .keyword-input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .submit-btn {
            background: linear-gradient(135deg, #00cc00, #00ff00);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 0, 0.5);
        }

        .error-message {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
            margin-top: 10px;
            display: none;
        }

        .glitch-text {
            animation: textGlitch 0.5s infinite;
        }

        @keyframes textGlitch {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-2px); }
            40% { transform: translateX(2px); }
            60% { transform: translateX(-1px); }
            80% { transform: translateX(1px); }
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
    <style>
        /* 全ページ共通ヘッダー。配色はページの文字色と背景に馴染ませる */
        body {
            padding-top: 68px;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(128, 128, 128, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(128, 128, 128, 0.35);
        }

        /* ページ番号はヘッダーより前面に置く */
        .page-number {
            z-index: 300;
        }

        .site-search {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid currentColor;
            border-radius: 20px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .site-search:focus-within {
            opacity: 1;
        }

        .site-search-input {
            width: 170px;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .site-search-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }

        .site-search-btn {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .site-search-input {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-search">
            <input type="text" class="site-search-input" placeholder="SEARCH" aria-label="サイト内検索">
            <button type="button" class="site-search-btn" aria-label="検索">&#9906;</button>
        </div>
    </header>
    <div class="container">
        <div class="page-number">48/55</div>
        
        <div class="log-header">
            <h1 class="log-title">FOUND ME</h1>
            <p class="log-subtitle">最終確認システム</p>
        </div>
        
        <div class="log-content">
            <div class="log-text">
                <p>よくここまで辿り着きました。</p>
                <p>あなたが真実に到達したことを確認します。</p>
                <br>
                <p>この先に進むには、あなたが本当に全てを理解したか確認する必要があります。</p>
                <br>
                <p class="glitch-text">「彼女たちの本当の名前を知っていますか？」</p>
                <br>
                <p>正しいキーワードを入力してください。</p>
                <p>答えは一つではありません。</p>
            </div>
        </div>

        <div class="terminal-input">
            <label class="terminal-label">KEYWORD INPUT &gt;</label>
            <input type="text" class="keyword-input" id="keywordInput" placeholder="キーワードを入力..." autocomplete="off">
            <button class="submit-btn" onclick="checkKeyword()">送信</button>
            <div class="error-message" id="errorMessage">不正解です。もう一度調査してください。</div>
        </div>
    </div>

    <script>
        function checkKeyword() {
            const input = document.getElementById('keywordInput').value.trim().toLowerCase();
            const errorMsg = document.getElementById('errorMessage');
            
            // 7人エンド（真エンドではないがバッドエンドでもない）
            if (input === 'unreal') {
                localStorage.setItem('endingType', 'seven');
                window.location.href = 'ending_seven.html';
            }
            // 8人真エンディング（ページ49からのパスワード）
            else if (input === 'easter') {
                localStorage.setItem('endingType', 'eight');
                window.location.href = 'ending_eight.html';
            }
            // バッドエンド
            else {
                errorMsg.style.display = 'block';
                setTimeout(() => {
                    localStorage.setItem('endingType', 'bad');
                    window.location.href = 'ending_bad.html';
                }, 2000);
            }
        }

        // Enterキーで送信
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkKeyword();
            }
        });
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
</body>
</html>
