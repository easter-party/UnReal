            },
            {
                no: 'No.44', title: '適応に関する資料',
                hints: ['メンバーのカルテに気になる項目はありませんか？検索してみましょう。'],
                answer: '「適応」を検索'
            },
            {
                no: 'No.45', title: '鑑定結果（完全版）',
                hints: [
                    'りんのカルテが出てきましたね。隅々まで確認してみましょう。',

            },

                hints: [

                ],
                answer: '「Signal」を検索'
            },

                no: 'No.48', title: '調査ページ',

            },

            },

            }

        // ヒント一覧を組み立てる
        const container = document.getElementById('accordionContainer');

        hintData.forEach(data => {
            const item = document.createElement('div');
            item.className = 'accordion-item';

            const header = document.createElement('div');
            header.className = 'accordion-header';
            header.innerHTML =
                '<span class="accordion-toggle">▶</span>'
                + `<span class="page-number-label">${data.no}</span>`
                + `<span class="page-title">${data.title}</span>`;
            header.addEventListener('click', () => item.classList.toggle('open'));

            const content = document.createElement('div');
            content.className = 'accordion-content';

            if (data.note) {
                const p = document.createElement('p');
                p.className = 'note-only';
                p.textContent = data.note;
                p.style.whiteSpace = 'pre-line';
                content.appendChild(p);
            }

            (data.hints || []).forEach((text, i) => {
                const d = document.createElement('details');
                d.innerHTML = `<summary>ヒント${i + 1}</summary><p>${text}</p>`;
                content.appendChild(d);
            });

            if (data.answer) {
                const d = document.createElement('details');
                d.className = 'answer';
                d.innerHTML = `<summary>答え</summary><p>${data.answer}</p>`;
                content.appendChild(d);
            }

            item.appendChild(header);
            item.appendChild(content);
            container.appendChild(item);
        });

        // 訪問記録（既存の仕様を維持）
        const visitedPages = JSON.parse(localStorage.getItem('visitedPages') || '[]');
        if (!visitedPages.includes('hint')) {
            visitedPages.push('hint');
            localStorage.setItem('visitedPages', JSON.stringify(visitedPages));
        }
    </script>

    <script>
        // どのページからでも検索できるようにする（トップの検索処理に渡す）
        (function() {
            const input = document.querySelector('.site-search-input');
            const submit = function() {
                const keyword = input.value.trim();
                if (keyword) {
                    window.location.href = '../index.html?search=' + encodeURIComponent(keyword);
                }
            };

            document.querySelector('.site-search-btn').addEventListener('click', submit);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submit();
                }
            });
        })();
    </script>
