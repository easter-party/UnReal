<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message - @fortune</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
            color: #333333;
            height: 100vh;
            overflow: hidden;
        }

        /* 名前入力画面 */
        .name-input-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .name-input-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .name-input-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .name-input-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .name-input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
            color: #333;
        }

        .name-input-field:focus {
            outline: none;
            border-color: #667eea;
        }

        .start-chat-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .start-chat-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start-chat-btn:not(:disabled):hover {
            opacity: 0.9;
        }

        .dm-container {
            max-width: 600px;
            height: 100vh;
            margin: 0 auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .dm-header {
            background-color: #f8f8f8;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: #333333;
            font-size: 20px;
            margin-right: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .profile-section {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0f0f0;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #666;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-weight: 700;
            font-size: 15px;
            color: #333;
        }

        .profile-handle {
            color: #666;
            font-size: 13px;
        }

        .dm-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            scroll-behavior: smooth;
            background-color: #ffffff;
        }

        .dm-messages::-webkit-scrollbar {
            width: 6px;
        }

        .dm-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .dm-messages::-webkit-scrollbar-thumb {
            background: #2f3336;
            border-radius: 3px;
        }

        .date-divider {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 20px 0;
        }

        /* 選択肢 */
        .choice-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .choice-btn {
            max-width: 80%;
            padding: 12px 18px;
            border: 1px solid #667eea;
            border-radius: 18px;
            background: #fff;
            color: #667eea;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
        }

        /* デバッグ用スキップボタン（テスト段階のみ設置） */
        .skip-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 100;
            padding: 10px 16px;
            border: 1px dashed #999;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #666;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skip-btn:hover {
            background: #666;
            color: #fff;
            border-color: #666;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.5s ease-in;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* 相手（なぎさ）は左、自分（プレイヤー）は右に寄せる */
        .message.fortune {
            justify-content: flex-start;
        }

        .message.player {
            justify-content: flex-end;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 75%;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        /* 自分の発言はヘッダーも右揃えにする */
        .message.player .message-header {
            justify-content: flex-end;
        }

        .message-name {
            font-weight: 700;
            font-size: 15px;
        }

        .message-handle {
            color: #71767b;
            font-size: 15px;
        }

        .message-time {
            color: #71767b;
            font-size: 13px;
        }

        /* 吹き出し本体 */
        .message-text {
            font-size: 15px;
            line-height: 1.5;
            padding: 10px 14px;
            border-radius: 18px;
            width: fit-content;
            word-break: break-word;
        }

        .message.fortune .message-text {
            background: #f0f0f0;
            color: #333;
            border-top-left-radius: 4px;
        }

        .message.player .message-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-top-right-radius: 4px;
            margin-left: auto;
        }

        .message-image {
            margin-top: 12px;
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid #2f3336;
        }

        .typing-indicator {
            display: none;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            width: fit-content;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #71767b;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .continue-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .continue-btn.show {
            display: block;
        }

        @media (max-width: 768px) {
            .dm-container {
                max-width: 100%;
            }

            .continue-btn {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
</head>
<body>
    <!-- 名前入力画面 -->
    <div class="name-input-screen" id="nameInputScreen">
        <div class="name-input-container">
            <h1 class="name-input-title">ようこそ</h1>
            <p class="name-input-subtitle">あなたの名前を教えてください</p>
            <input type="text" class="name-input-field" id="userNameInput" placeholder="名前を入力">
            <button class="start-chat-btn" id="startChatBtn" disabled>会話を開始</button>
        </div>
    </div>

    <div class="dm-container">
        <div class="dm-header">
            <a href="../index.html" class="back-btn">←</a>
            <div class="profile-section">
                <div class="profile-pic">👤</div>
                <div class="profile-info">
                    <div class="profile-name">？？？</div>
                    <div class="profile-handle">@fortune_ngs</div>
                </div>
            </div>
        </div>

        <div class="dm-messages" id="messageContainer">
            <div class="date-divider">2025年2月10日</div>
            
            <!-- メッセージがJavaScriptで動的に追加される -->
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <a href="../index.html" class="continue-btn" id="continueBtn">
            サイトへ進む →
        </a>
    </div>

    <!-- デバッグ用：導入会話を最後まで飛ばす（テスト段階のみ） -->
    <button type="button" class="skip-btn" id="skipBtn" onclick="skipConversation()">
        DEBUG: 会話をスキップ ⏭
    </button>

    <script>
        // 初回訪問チェック
        window.addEventListener('DOMContentLoaded', function() {
            const hasVisited = localStorage.getItem('hasVisitedDM');
            const nameInputScreen = document.getElementById('nameInputScreen');
            const userNameInput = document.getElementById('userNameInput');
            const startChatBtn = document.getElementById('startChatBtn');
            
            if (hasVisited === 'true') {
                // 2回目以降：名前入力をスキップして即座に会話開始
                nameInputScreen.style.display = 'none';
                startConversation();
            } else {
                // 初回：名前入力画面を表示
                userNameInput.addEventListener('input', function() {
                    startChatBtn.disabled = this.value.trim().length === 0;
                });

                userNameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && this.value.trim().length > 0) {
                        startChatProcess();
                    }
                });

                startChatBtn.addEventListener('click', startChatProcess);
            }
            
            function startChatProcess() {
                const userName = userNameInput.value.trim();
                if (userName) {
                    localStorage.setItem('playerName', userName);
                    localStorage.setItem('hasVisitedDM', 'true');
                    
                    // フェードアウト効果
                    nameInputScreen.style.opacity = '0';
                    setTimeout(() => {
                        nameInputScreen.style.display = 'none';
                        startConversation();
                    }, 500);
                }
            }
        });

        const messages = [
            { sender: 'fortune', text: '突然のご連絡で申し訳ありません。', delay: 1000 },
            { sender: 'fortune', text: '私、UnRe:alというアイドルグループで活動している 詩藤なぎさ といいます。', delay: 2000 },
            { sender: 'fortune', text: '前のグループの頃からライブに来てくださっている方ですよね？', delay: 2000 },
            { sender: 'player', text: 'えっ！', delay: 1500 },
            { sender: 'player', text: 'そうですけど……あの、本当になぎさちゃんですか？', delay: 2000 },
            { sender: 'fortune', text: '一応本人です。こちらで信じていただければと。', delay: 2000, hasImage: true },
            { sender: 'player', text: '(ほ、本物だ……)', delay: 1500 },
            { sender: 'player', text: '……分かりました。信じます。それで、なぜ急にただのファンである私に連絡を？', delay: 2500 },
            { sender: 'fortune', text: '実は折り入ってご相談がありまして。あなたにしか頼めないことなんです。聞いていただけますか？', delay: 2500 },
            { sender: 'player', text: '私にしか頼めないこと？', delay: 1500 },
            { sender: 'fortune', text: 'はい。以前お話し会に来てくださった時に、普段探偵をやられているって仰っていましたよね？そのことで、あなたに依頼したいことがあるんです。', delay: 3000 },
            { sender: 'player', text: '言いましたけど……その話随分前にした話なのに、覚えててくれたんですね。', delay: 2500 },
            { sender: 'fortune', text: '記憶力はいい方なんです。って、そんなことは良くて。', delay: 2000 },
            { sender: 'fortune', text: '正直、あまり表立って言えない内容なんですが……お話だけでも聞いて頂けませんか？', delay: 2500 },
            { sender: 'player', text: '分かりました。', delay: 2000 },
            {
                type: 'choice',
                options: [
                    {
                        text: 'でも、もし私が本物の探偵じゃなかったらどうするんです？',
                        reply: '貴方が本物の探偵の方だということは事前にこちらで調査させて頂いたうえでご連絡してますので、大丈夫です。'
                    },
                    {
                        text: '依頼とはなんでしょうか？',
                        reply: '私たちのファンでいて下さっているあなたには少しショッキングかもしれないんですが……'
                    }
                ]
            },
            { sender: 'fortune', text: '実は、センターの 暁月りん が突然失踪したんです。ワンマンも迫ってきていますし、りんを探す手伝いをして頂きたくて。', delay: 3000 },
            {
                type: 'choice',
                options: [
                    { text: 'え、本当なんですか！？', reply: '私達も信じたくないんですけど……。' },
                    { text: 'りんちゃんが……？', reply: 'そうなんです。' }
                ]
            },
            { sender: 'fortune', text: 'メンバー全員でのミーティングがあるはずだった日の朝、突然私にメッセージが送られてきたんです。そのメッセージがとても意味深だったので慌てて連絡したんですけど、そこから音信不通で。', delay: 3500 },
            { sender: 'fortune', text: 'あまりに突然ですし、危ないことに巻き込まれているのかもしれないと思ったので私たちも探したいと申し出たんですが、どういうわけか事務所は今回の件について警察への通報も、私たちの関与も認めないとの一点張りで。', delay: 4000 },
            { sender: 'fortune', text: '手の打ちようが無くなっていたところで貴方のことを思い出したんです。事務所に止められている以上公には出来ないので、私が単独で動くしかないと思って。ですから あなたに依頼したことはメンバーにも伝えていません。', delay: 4000 },
            { sender: 'player', text: 'そうだったんですね。事情は分かりました。', delay: 2000 },
            { sender: 'player', text: '私も協力します。', delay: 1500 },
            { sender: 'fortune', text: 'よかった！ありがとうございます。もし今後何か分かったことや、連絡があればこのアカウントに連絡してください。ここは私しか見られないようになっているので。', delay: 3000 },
            { sender: 'fortune', text: 'それから、私に送られてきたメッセージのログを共有しておきます。', delay: 2000, hasScreenshot: true },
            { sender: 'fortune', text: 'これは私の予想でしかないですが、おそらくりんは知ってはいけない"何か"を知ってしまったんだと思います。それも、事務所絡みの。', delay: 3000 },
            { sender: 'fortune', text: '事務所は私たちに何かを隠しています。しかもその内容を知られる危険性があるのに、特に慌てていないように見える。', delay: 3000 },
            { sender: 'fortune', text: 'ということは、よっぽど隠し通せる自信があるんだと思います。', delay: 2500 },
            { sender: 'fortune', text: '私は表立っては動けない状態なので、あなたに手伝って頂けて本当に助かります。', delay: 2500 },
            { sender: 'fortune', text: '私の方でもできる限り色々探ってみます。何かこちらでも分かったことがあれば連絡しますね。', delay: 3000 },
            { sender: 'fortune', text: 'あ、そうだ。先ほどの画像とやり取りは、念のため私のプライベートブログに保存しておきました。', delay: 2500 },
            { sender: 'fortune', text: 'UnRe:alの公式サイトの検索欄に「DM」と入力していただければ、いつでも確認できるようにしてあります。', delay: 3000 },
            { sender: 'fortune', text: 'あたしがみつけた手がかりを残しておきます。', delay: 2000 },
            { sender: 'fortune', text: '調査に詰まっていることがあれば私のユーザー名「@fortune_ngs」で検索してみてください。', delay: 2500 },
            { sender: 'fortune', text: 'それでは、よろしくお願いします。りんのこと、必ず見つけましょう。', delay: 2500 }
        ];

        let currentMessageIndex = 0;
        const messageContainer = document.getElementById('messageContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const continueBtn = document.getElementById('continueBtn');

        function createMessage(messageData) {
            const messageDiv = document.createElement('div');
            // 送信者に応じて左右の寄せ方を切り替える
            messageDiv.className = `message ${messageData.sender}`;
            messageDiv.style.animationDelay = '0s';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'message-name';
            nameSpan.textContent = messageData.sender === 'fortune' ? '？？？' : 'You';

            const handleSpan = document.createElement('span');
            handleSpan.className = 'message-handle';
            handleSpan.textContent = messageData.sender === 'fortune' ? '@fortune_ngs' : '@player';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            const now = new Date();
            timeSpan.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

            headerDiv.appendChild(nameSpan);
            headerDiv.appendChild(handleSpan);
            headerDiv.appendChild(timeSpan);

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = messageData.text;

            contentDiv.appendChild(headerDiv);
            contentDiv.appendChild(textDiv);

            if (messageData.hasImage) {
                const img = document.createElement('img');
                img.className = 'message-image';
                img.src = '../images/docs/dm_identity.png';
                img.alt = '本人確認のために送られてきた画像';
                contentDiv.appendChild(img);
            }

            if (messageData.hasScreenshot) {
                const img = document.createElement('img');
                img.className = 'message-image';
                img.src = '../images/docs/dm_rin_nagisa.jpg';
                img.alt = '失踪当日に暁月りんから詩藤なぎさへ送られたメッセージのログ';
                contentDiv.appendChild(img);
            }

            messageDiv.appendChild(contentDiv);

            return messageDiv;
        }

        // スキップ済みフラグと進行中タイマー（スキップ時に停止するため保持する）
        let isSkipped = false;
        let messageTimer = null;

        function finishConversation() {
            typingIndicator.classList.remove('show');
            continueBtn.classList.add('show');
            document.getElementById('skipBtn').style.display = 'none';
        }

        // 選択肢を表示して、選ばれるまで進行を止める
        function showChoices(messageData) {
            const group = document.createElement('div');
            group.className = 'choice-group';

            messageData.options.forEach(option => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'choice-btn';
                btn.textContent = option.text;

                btn.addEventListener('click', function() {
                    group.remove();
                    currentMessageIndex++;

                    // 選んだ内容を自分の発言として表示する
                    messageContainer.appendChild(createMessage({ sender: 'player', text: option.text }));
                    messageContainer.scrollTop = messageContainer.scrollHeight;

                    // 選択に応じた返答を次のメッセージとして差し込む
                    messages.splice(currentMessageIndex, 0, {
                        sender: 'fortune',
                        text: option.reply,
                        delay: 2500
                    });

                    messageTimer = setTimeout(showNextMessage, 800);
                });

                group.appendChild(btn);
            });

            messageContainer.appendChild(group);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function showNextMessage() {
            if (isSkipped) {
                return;
            }

            if (currentMessageIndex >= messages.length) {
                finishConversation();
                return;
            }

            const messageData = messages[currentMessageIndex];

            // 選択肢は入力待ちにする
            if (messageData.type === 'choice') {
                typingIndicator.classList.remove('show');
                showChoices(messageData);
                return;
            }

            // タイピングインジケーターを表示
            if (messageData.sender === 'fortune') {
                typingIndicator.classList.add('show');
                messageContainer.appendChild(typingIndicator);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }

            messageTimer = setTimeout(() => {
                if (isSkipped) {
                    return;
                }

                typingIndicator.classList.remove('show');
                const messageElement = createMessage(messageData);
                messageContainer.appendChild(messageElement);
                messageContainer.scrollTop = messageContainer.scrollHeight;

                currentMessageIndex++;
                messageTimer = setTimeout(showNextMessage, messageData.delay);
            }, messageData.sender === 'fortune' ? 1500 : 500);
        }

        // デバッグ用：残りの会話を一気に表示して終端まで飛ばす
        function skipConversation() {
            isSkipped = true;
            clearTimeout(messageTimer);
            typingIndicator.classList.remove('show');

            // 表示中の選択肢は取り除く
            const pendingChoice = messageContainer.querySelector('.choice-group');
            if (pendingChoice) {
                pendingChoice.remove();
            }

            const appendInstantly = data => {
                const element = createMessage(data);
                element.style.animation = 'none';
                element.style.opacity = '1';
                messageContainer.appendChild(element);
            };

            while (currentMessageIndex < messages.length) {
                const data = messages[currentMessageIndex];

                // 未選択の選択肢は先頭の選択肢を選んだものとして流す
                if (data.type === 'choice') {
                    const option = data.options[0];
                    appendInstantly({ sender: 'player', text: option.text });
                    appendInstantly({ sender: 'fortune', text: option.reply });
                    currentMessageIndex++;
                    continue;
                }

                appendInstantly(data);
                currentMessageIndex++;
            }

            messageContainer.scrollTop = messageContainer.scrollHeight;
            finishConversation();
        }

        // 会話を開始する関数
        function startConversation() {
            messageTimer = setTimeout(showNextMessage, 1000);
        }
    </script>
