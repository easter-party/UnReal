<!DOCTYPE html>

    <title>検索結果 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
            color: #222;
            min-height: 100vh;
            padding: 40px 20px;

            transition: background 0.2s;
        }

        .result-item:hover {
            background: #fff;
        }

        .result-url {
            color: #3a7d3a;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .result-title {
            color: #1a4fb4;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .result-item:hover .result-title {
            text-decoration: underline;
        }

        .result-snippet {
            color: #555;
            font-size: 13px;
            line-height: 1.8;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #222;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
