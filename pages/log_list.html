<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調査ログ一覧 - UnReal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 0, 0.03) 3px
            );
            pointer-events: none;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #00ff00;
        }
        
        .title {
            font-size: 36px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #00cc00;
            font-size: 14px;
        }
        
        .progress-bar {
            background: #001100;
            border: 1px solid #00ff00;
            border-radius: 5px;
            height: 30px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #00ff00, #00cc00);
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .progress-text {
            color: #000;
            font-weight: bold;
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 30px;
        }
        
        .log-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-bottom: 40px;
        }
        
        .log-item {
            aspect-ratio: 1;
            background: #001100;
            border: 1px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .log-item.visited {
            background: #003300;
            color: #00ff00;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        .log-item.visited::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            color: #00ff00;
        }
        
        .log-item:hover {
            background: #002200;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }
        
        .log-item.current {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00ff00; }
            50% { box-shadow: 0 0 20px #00ff00; }
        }
        
        .log-details {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .log-details h3 {
            color: #00ff00;
            margin-bottom: 15px;
        }
        
        .visited-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .visited-item {
            background: #002200;
            border: 1px solid #00ff00;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .visited-item:hover {
            background: #003300;
            transform: translateY(-2px);
        }
        
        .search-box {
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .search-box:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #00ff00;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
    <link rel="icon" href="../images/logo/unreal.png">
</head>
<body>
    <div class="page-number" style="position:fixed;top:20px;right:20px;font-size:12px;opacity:0.5;z-index:200;pointer-events:none;">-/55</div>
    <div class="container">
        <div class="header">
            <h1 class="title">調査ログ一覧</h1>
            <p class="subtitle">Investigation Progress Tracker</p>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill">
                <span class="progress-text" id="progressText">0/50 (0%)</span>
            </div>
        </div>
        
        <input type="text" class="search-box" id="searchBox" placeholder="ページ番号を入力して直接移動...">
        
        <div class="log-grid" id="logGrid">
            <!-- JavaScriptで動的に生成 -->
        </div>
        
        <div class="log-details">
            <h3>訪問済みページ</h3>
            <div class="visited-list" id="visitedList">
                <!-- JavaScriptで動的に生成 -->
            </div>
        </div>
        
        <a href="../index.html" class="back-link">← TOPに戻る</a>
    </div>
    
    <script>
        // ページ情報（CSVベース）
        const pageInfo = {
            0: 'DM',
            1: 'TOP',
            2: 'NEWS',
            3: 'PROFILE',
            4: 'DISCOGRAPHY',
            5: 'BLOG',
            6: 'GALLERY',
            7: 'ABOUT',
            8: 'FC LOGIN',
            9: 'メッセージログ',
            10: '灰谷の履歴書',
            11: 'ゆののカルテ',
            12: 'らんのカルテ',
            13: '契約書',
            14: '鑑定結果',
            15: 'リーク記事',
            16: 'エッグスHP',
            17: 'みれいのカルテ',
            18: 'りんBLOG',
            19: 'ゆのBLOG',
            20: 'あきBLOG',
            21: 'みれいBLOG',
            22: 'いろはBLOG',
            23: 'らんBLOG',
            24: 'なぎさBLOG',
            25: 'クローン取引',
            26: 'クローン資料',
            27: 'いろはのカルテ',
            28: '最終試験結果',
            29: 'パスワード画面',
            30: 'りんBLOG_EX',
            31: 'ゆのBLOG_EX',
            32: 'あきBLOG_EX',
            33: 'みれいBLOG_EX',
            34: 'いろはBLOG_EX',
            35: 'らんBLOG_EX',
            36: 'なぎさBLOG_EX',
            37: 'ニュース記事',
            38: 'あきのカルテ',
            39: 'なぎさのカルテ',
            40: '脳機能実験',
            41: 'りんちゃんのこと',
            42: 'りんのカルテ',
            43: 'RN016完成報告',
            44: 'ふうかのカルテ',
            45: '研究施設概要',
            46: '調査ページ',
            47: '会話ログ',
            48: '開発報告書',
            49: '調査ログex'
        };
        
        // ローカルストレージから訪問済みページを取得
        function getVisitedPages() {
            const visited = localStorage.getItem('visitedPages');
            return visited ? JSON.parse(visited) : [];
        }
        
        // 現在のページ番号を取得
        function getCurrentPage() {
            return localStorage.getItem('currentLogPage') || '0';
        }
        
        // ログ一覧を生成
        function generateLogGrid() {
            const grid = document.getElementById('logGrid');
            const visitedPages = getVisitedPages();
            const currentPage = getCurrentPage();
            
            for (let i = 0; i < 50; i++) {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.textContent = String(i).padStart(2, '0');
                
                // 訪問済みチェック
                if (visitedPages.includes(String(i))) {
                    item.classList.add('visited');
                    item.title = pageInfo[i] || `ページ ${i}`;
                    item.onclick = () => goToPage(i);
                } else {
                    item.title = '未訪問';
                    item.style.cursor = 'not-allowed';
                    item.style.opacity = '0.5';
                }
                
                // 現在のページをハイライト
                if (String(i) === currentPage) {
                    item.classList.add('current');
                }
                
                grid.appendChild(item);
            }
        }
        
        // 訪問済みリストを生成
        function generateVisitedList() {
            const list = document.getElementById('visitedList');
            const visitedPages = getVisitedPages();
            
            if (visitedPages.length === 0) {
                list.innerHTML = '<span style="color: #666;">まだページを訪問していません</span>';
                return;
            }
            
            visitedPages.forEach(pageNo => {
                const item = document.createElement('div');
                item.className = 'visited-item';
                item.textContent = `No.${pageNo}: ${pageInfo[pageNo] || '???'}`;
                item.onclick = () => goToPage(pageNo);
                list.appendChild(item);
            });
        }
        
        // プログレスバーを更新
        function updateProgress() {
            const visitedPages = getVisitedPages();
            const progress = (visitedPages.length / 50) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `${visitedPages.length}/50 (${Math.round(progress)}%)`;
        }
        
        // ページ遷移
        function goToPage(pageNo) {
            window.location.href = '../index.html?search=' + pageNo;
        }
        
        // 検索ボックス
        document.getElementById('searchBox').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const pageNo = this.value.trim();
                if (pageNo >= 0 && pageNo < 50) {
                    goToPage(pageNo);
                }
            }
        });
        
        // 初期化
        generateLogGrid();
        generateVisitedList();
        updateProgress();
        
        // デバッグ用：訪問済みページを追加
        // localStorage.setItem('visitedPages', JSON.stringify(['0', '1', '2', '3', '46']));
    </script>
    <footer class="site-common-footer" style="margin-top:60px;padding:24px 20px;text-align:center;font-size:11px;line-height:1.9;opacity:0.55;">
        <p>&copy;2027 イースターパーティー</p>
        <p>このWebサイトの内容は全てフィクションです。実在する人物･事件･団体とは一切関係ありません。</p>
    </footer>
</body>
</html>
